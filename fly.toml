# Harper Middle Bro — shared desk on Fly.io.
#
# Exactly one Machine, one volume. The desk's record lives in SQLite on the
# volume, so a second Machine would quietly serve its own empty database:
# never `fly scale count` this app above 1.
#
# First deploy:
#   fly launch --no-deploy --copy-config --name harper-middle-bro
#   fly volumes create desk_data --region sjc --size 1
#   fly secrets set NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_... CLERK_SECRET_KEY=sk_test_...
#   fly deploy
#
# Both Clerk keys are runtime values, so rotating the Clerk app is
# `fly secrets set` plus a restart — no rebuild. Neither is committed here:
# the publishable key is public by design but still identifies whichever Clerk
# app this instance authenticates against.

app = "harper-middle-bro"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  DESK_DATA_DIR = "/data"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  # Always warm and never more than one: the volume can attach to a single
  # Machine, and the desk is a shared record rather than a stateless app.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "15s"
    timeout = "3s"
    grace_period = "30s"

[mounts]
  source = "desk_data"
  destination = "/data"
  initial_size = "1GB"
  snapshot_retention = 14

[deploy]
  # One Machine holding one volume cannot roll or blue-green: it stops, then
  # the replacement starts. A few seconds of downtime per deploy.
  strategy = "immediate"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

# Cheap insurance against an out-of-memory kill while rendering.
swap_size_mb = 512
